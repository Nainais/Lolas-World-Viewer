
name: Build Lolas World Viewer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Aurora-Viewer-main

    steps:
      - name: Checkout Aurora source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Viewer
        run: cargo build --release --locked -p aurora-viewer

      - name: Prepare EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/aurora-viewer.exe dist/LolasWorldViewer.exe

      - name: Upload Viewer
        uses: actions/upload-artifact@v4
        with:
          name: Lolas-World-Viewer-Windows
          path: Aurora-Viewer-main/dist/
